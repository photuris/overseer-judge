name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$TARGET" in
            *-linux-*) OS=linux ;;
            *-apple-darwin) OS=darwin ;;
            *-windows-*) OS=windows ;;
            *) echo "unknown target $TARGET" >&2; exit 1 ;;
          esac
          case "$TARGET" in
            x86_64-*) ARCH=amd64 ;;
            aarch64-*) ARCH=arm64 ;;
            *) echo "unknown target $TARGET" >&2; exit 1 ;;
          esac
          STAGE=stage
          mkdir "$STAGE"
          cp LICENSE README.md "$STAGE/"
          if [ "$OS" = windows ]; then
            ARCHIVE="overseer-judge_${VERSION}_windows_${ARCH}.zip"
            cp "target/$TARGET/release/overseer-judge.exe" "$STAGE/"
            (cd "$STAGE" && 7z a -tzip "../$ARCHIVE" overseer-judge.exe LICENSE README.md)
          else
            ARCHIVE="overseer-judge_${VERSION}_${OS}_${ARCH}.tar.gz"
            file "target/$TARGET/release/overseer-judge"
            cp "target/$TARGET/release/overseer-judge" "$STAGE/"
            tar -C "$STAGE" -czf "$ARCHIVE" overseer-judge LICENSE README.md
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --generate-notes *.tar.gz *.zip checksums.txt
